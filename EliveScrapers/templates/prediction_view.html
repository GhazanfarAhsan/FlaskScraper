<html>
    <head>
    <link  rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.bundle.min.js"></script>
    <style>
        .main-container{
            margin-left: 30%;
            /* margin-top: 10%; */
            background-color:wheat;
            width: 500px;
            text-align: center;
            padding-top: 30px;
        }
        .heading-container{
            margin-left: 30%;
            margin-top: 10%;
            width: 500px;
            text-align: center;
            /* padding: 30px; */
        }

    </style>
    </head>
    <body>
        <div class="container heading-container">
            <h3>Football Predictor</h3>
        </div>
        <div class="container main-container">
            <div class="row">               
                <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 ">
                    
                    <div class="form-group">
                            <input type="text" class="form-control" id="homeTeam" name="url" placeholder="Enter Home Team">
                            <input type="text" class="form-control" id="awayTeam" name="url" placeholder="Enter Away Team">
                            <input type="text" class="form-control" id="venue" name="url" placeholder="Enter Venue">
                    </div>
                    <br/>
                    <br/>

                    <div class="alert alert-succes" id="result">
                        
                    </div>
                    <button type="button" class="btn btn-primary" onclick="getPrediction()">Submit</button>
                   
                </div>
            </div>
        </div>
    </body>
    <script>
        
        function getPrediction() {
            const url = 'http://127.0.0.1:5000/football/predict/store';
            const data = {
                homeTeam: document.getElementById('homeTeam').value,
                awayTeam:document.getElementById('awayTeam').value,
                venue:document.getElementById('venue').value
            };
            fetch(url,{
                    method: 'POST', // Specify the method
                    headers: {
                        'Content-Type': 'application/json' // Set the content type to JSON
                    },
                    body: JSON.stringify(data) // Convert the data object to a JSON string
                })
                .then(response => response.json())
                .then(data => {
                    if(data.data.result == "Away Win")
                        document.getElementById('result').innerText = document.getElementById('awayTeam').value + ' Win';
                    else 
                        document.getElementById('result').innerText = document.getElementById('homeTeam').value + ' Win';
                   
                })
                .catch(error => console.error('Error:', error));
        }
    </script>
</html>
